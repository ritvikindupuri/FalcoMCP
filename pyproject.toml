[project]
name = "falco-triage-mcp"
version = "0.1.0"
description = "Falco Container Security & Rule Tuning MCP Server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "kubernetes>=30.0.0",
    "ruamel.yaml>=0.18.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
falco-triage = "falco_triage.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/falco_triage"]

[dependency-groups]
dev = [
    "pillow>=12.3.0",
]
